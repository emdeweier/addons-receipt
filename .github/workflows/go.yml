name: Deploy Go App to Docker on VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          echo "${{ secrets.SSH_PASSPHRASE }}" | ssh-add ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd /project-go
            git fetch origin main
            git reset --hard origin/main
            
            # Build image dengan path eksplisit
            sudo docker build -t addons-receipt -f /project-go/Dockerfile /project-go

            # Restart container
            sudo docker stop addons-receipt || true
            sudo docker rm addons-receipt || true
            sudo docker run -d -p 8080:8080 --name addons-receipt addons-receipt
          EOF
