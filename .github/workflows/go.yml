name: Deploy Go App to Docker on VPS

on:
  push:
    branches:
      - main  # Atau ganti dengan nama branch yang kamu inginkan
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Checkout kode dari repo
    - name: Checkout code
      uses: actions/checkout@v2

    # Setup Docker Buildx untuk building image
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    # Build Docker image dan push ke Docker Hub
    - name: Build and Push Docker image
      run: |
        docker build -t username/addons-receipt .
        docker tag username/addons-receipt username/addons-receipt:latest
        docker push username/addons-receipt:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Deploy to VPS
      run: |
        # Login ke VPS dan pull image terbaru
        ssh -o StrictHostKeyChecking=no -i ${{ secrets.SSH_PRIVATE_KEY }} user@vps-ip-address "
          docker pull username/addons-receipt:latest && 
          docker stop addons-receipt || true &&
          docker rm addons-receipt || true &&
          docker run -d -p 8080:8080 --name myapp username/addons-receipt:latest
        "
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
